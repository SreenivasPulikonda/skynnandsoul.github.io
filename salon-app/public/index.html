</style></head><body><div id="app"><div class="skeleton">Opening your salon workspace…</div></div><div id="modal-root"></div><div id="print-area"></div><noscript>This app needs JavaScript. Please enable it in your browser.</noscript><script>"use strict";
/* Shared, dependency-free business rules. Currency is always stored in paise. */
const SCHEMA = 1;
const METHODS = ['cash','upi','card','bank'];
class AppError extends Error { constructor(message,status=400){super(message);this.status=status;} }
function assert(ok,msg,status=400){if(!ok)throw new AppError(msg,status);}
const copy=x=>JSON.parse(JSON.stringify(x));
const day=(when=new Date())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(when));
const uid=()=>{if(globalThis.crypto.randomUUID)return globalThis.crypto.randomUUID();const b=globalThis.crypto.getRandomValues(new Uint8Array(16));b[6]=(b[6]&15)|64;b[8]=(b[8]&63)|128;return [...b].map((v,i)=>([4,6,8,10].includes(i)?'-':'')+v.toString(16).padStart(2,'0')).join('');};
function text(v,max=200,required=false){const s=String(v??'').trim();assert(s.length<=max,'Text is too long.');assert(!required||s.length,'Please fill all required fields.');return s;}
function integer(v,min=0,max=100000000){const n=Number(v);assert(Number.isSafeInteger(n)&&n>=min&&n<=max,'Enter a valid whole number.');return n;}
function quantity(v,min=0,max=1000000){const n=Number(v);assert(Number.isFinite(n)&&n>=min&&n<=max,'Enter a valid quantity.');return Math.round(n*1000)/1000;}
function amount(v){return integer(v,0,10000000000);}
function paise(v){const s=String(v).trim();assert(/^\d+(\.\d{1,2})?$/.test(s),'Enter a positive amount with at most two decimal places.');return amount(Math.round(Number(s)*100));}
function date(v){assert(/^\d{4}-\d{2}-\d{2}$/.test(v||'')&&!Number.isNaN(Date.parse(v)),'Choose a valid date.');assert(new Date(v+'T00:00:00Z').toISOString().slice(0,10)===v,'Choose a valid date.');return v;}
function phone(v){const s=String(v??'').replace(/[\s()+-]/g,'');assert(!s||/^\d{7,15}$/.test(s),'Enter a phone number with 7 to 15 digits.');return s;}
const active=x=>x.active!==false;
function emptyState(){return {schema:SCHEMA,revision:0,createdAt:new Date().toISOString(),settings:{salonName:'Skynn & Soul Beauty Salon',address:'',phone:'',gstin:'',invoicePrefix:'SS',taxLabel:'Tax',taxMode:'exclusive',defaultTaxBps:0,managerDiscountBps:1000,receiptNote:'Thank you for choosing Skynn & Soul.',currency:'INR'},customers:[],services:[],products:[],staff:[],appointments:[],invoices:[],payments:[],stockMoves:[],expenses:[],purchases:[],vendorPayments:[],attendance:[],closures:[],audit:[],operations:[]};}
function find(s,collection,id){const x=s[collection].find(x=>x.id===id);assert(x,`This ${collection.replace(/s$/,'')} no longer exists. Refresh and try again.`,404);return x;}
function owner(actor){assert(actor?.role==='owner','Only the owner can make this change.',403);}
function expected(record,input){assert(input.version===record.version,'This record changed on another device. Refresh before editing.',409);}
const row=(data,id,now)=>({...data,id,version:1,createdAt:now,updatedAt:now});
function balance(s,id){const inv=find(s,'invoices',id);return inv.status==='void'?0:inv.total-s.payments.filter(p=>p.invoiceId===id).reduce((n,p)=>n+p.amount,0);}
function quote(s,input,actor={role:'owner'},now=new Date().toISOString()){
 assert(Array.isArray(input.lines)&&input.lines.length>0&&input.lines.length<=60,'Add at least one service or product.');
 const lines=input.lines.map(x=>{assert(['service','product'].includes(x.kind),'Invalid bill item.');const r=find(s,x.kind==='service'?'services':'products',x.id);assert(active(r),'An item on this bill is inactive.');if(x.kind==='product')assert(r.retail,'This product is for salon use only.');const qty=integer(x.qty,1,1000);const price=r.price;const gross=price*qty;return {kind:x.kind,id:r.id,name:r.name,sku:r.sku||'',qty,price,taxBps:r.taxBps??s.settings.defaultTaxBps,staffId:x.staffId||'',gross};});
 for(const l of lines)if(l.staffId)assert(active(find(s,'staff',l.staffId)),'Select an active staff member.');
 const subtotal=amount(lines.reduce((a,l)=>a+l.gross,0));const discount=amount(input.discount||0);assert(discount<=subtotal,'Discount cannot exceed the bill value.');
 if(actor.role==='manager')assert(discount*10000<=subtotal*s.settings.managerDiscountBps,'Discount is above your limit. Ask the owner to approve this bill.',403);
 if(discount)text(input.discountReason,300,true);
 let allocated=0;const positive=lines.map((l,i)=>l.gross>0?i:-1).filter(i=>i>=0);const last=positive.at(-1);
 lines.forEach((l,i)=>{l.discount=!l.gross?0:i===last?discount-allocated:Number(BigInt(discount)*BigInt(l.gross)/BigInt(subtotal||1));allocated+=l.discount;const net=l.gross-l.discount;
 l.tax=s.settings.taxMode==='inclusive'?net-Math.round(net*10000/(10000+l.taxBps)):Math.round(net*l.taxBps/10000);l.net=s.settings.taxMode==='inclusive'?net-l.tax:net;l.total=s.settings.taxMode==='inclusive'?net:net+l.tax;
 const st=s.staff.find(x=>x.id===l.staffId);l.staffName=st?.name||'';l.incentive=Math.round(l.net*(st?.incentiveBps||0)/10000);
 });
 const needs=new Map();
 for(const l of lines){if(l.kind==='product')needs.set(l.id,(needs.get(l.id)||0)+l.qty);else{const svc=find(s,'services',l.id);for(const r of svc.recipe||[])needs.set(r.productId,(needs.get(r.productId)||0)+r.qty*l.qty);}}
 const consumed=[];for(const [id,n]of needs){const p=find(s,'products',id);const qty=quantity(n);assert(active(p),`${p.name} is inactive.`);assert(p.stock+0.0001>=qty,`Not enough ${p.name}. Need ${qty} ${p.unit}; available ${p.stock}.`);assert(!p.expiry||p.expiry>=day(now),`${p.name} has expired. Update stock before using it.`);consumed.push({productId:id,name:p.name,qty,unitCost:p.cost,cost:Math.round(qty*p.cost)});}
 return {lines,subtotal,discount,tax:lines.reduce((a,l)=>a+l.tax,0),net:lines.reduce((a,l)=>a+l.net,0),total:lines.reduce((a,l)=>a+l.total,0),consumed,cost:consumed.reduce((a,p)=>a+p.cost,0)};
}
function applyOperation(original,op,actor,now=new Date().toISOString()){
 assert(actor&&['owner','manager'].includes(actor.role),'Sign in to continue.',401);assert(op&&/^[a-zA-Z0-9_-]{8,100}$/.test(op.id),'Invalid request ID.');
 const prior=original.operations.find(x=>x.id===op.id);if(prior)return {state:original,result:prior.result,replayed:true};
 const s=copy(original),p=op.payload||{};let result={};const today=day(now);const change=(rec,data)=>Object.assign(rec,data,{version:rec.version+1,updatedAt:now});
 const save=(coll,data,id)=>{if(id){let r=find(s,coll,id);expected(r,p);change(r,data);return r;}const r=row(data,op.id,now);s[coll].push(r);return r;};
 const move=(product,delta,reason,ref)=>{product.stock=quantity(product.stock+delta);change(product,{});s.stockMoves.push(row({productId:product.id,delta,balance:product.stock,reason,ref,by:actor.name,date:today},`${op.id}-${s.stockMoves.length}`,now));};
 const financial=['invoice.create','payment.create','invoice.void','purchase.create','purchase.pay','expense.create'];
 if(financial.includes(op.type)){const d=['purchase.create','expense.create'].includes(op.type)?date(p.date||today):today;assert(d<=today,'Future financial dates are not allowed.');assert(!s.closures.some(c=>c.date===d&&!c.reopenedAt),'This day is closed. Ask the owner to reopen it before changing money records.',409);}
 switch(op.type){
 case 'customer.save':{const num=phone(p.phone);assert(!num||!s.customers.some(c=>c.phone===num&&c.id!==p.id),'This phone number is already saved.');const data={name:text(p.name,100,true),phone:num,email:text(p.email,150),notes:text(p.notes,1000),marketingConsent:p.marketingConsent===true,birthday:p.birthday?date(p.birthday):'',membershipUntil:p.membershipUntil?date(p.membershipUntil):'',active:p.active!==false};const r=save('customers',data,p.id);result={id:r.id};break;}
 case 'staff.save':{owner(actor);const data={name:text(p.name,80,true),role:text(p.role,50)||'Stylist',phone:phone(p.phone),incentiveBps:integer(p.incentiveBps||0,0,10000),active:p.active!==false};result={id:save('staff',data,p.id).id};break;}
 case 'service.save':{owner(actor);const recipe=(p.recipe||[]).map(x=>{find(s,'products',x.productId);return {productId:x.productId,qty:quantity(x.qty,0.001)};});assert(recipe.length<=20,'Too many products in service recipe.');const data={name:text(p.name,100,true),category:text(p.category,60)||'General',price:amount(p.price),duration:integer(p.duration||30,5,720),taxBps:integer(p.taxBps||0,0,10000),recipe,active:p.active!==false};result={id:save('services',data,p.id).id};break;}
 case 'product.save':{owner(actor);const sku=text(p.sku,50,true);assert(!s.products.some(x=>x.sku.toLowerCase()===sku.toLowerCase()&&x.id!==p.id),'This SKU is already used.');const data={name:text(p.name,100,true),sku,category:text(p.category,60)||'General',unit:text(p.unit,20)||'unit',price:amount(p.price||0),cost:amount(p.cost||0),taxBps:integer(p.taxBps||0,0,10000),reorder:quantity(p.reorder||0),expiry:p.expiry?date(p.expiry):'',supplier:text(p.supplier,100),retail:p.retail===true,active:p.active!==false};if(!p.id)data.stock=0;const r=save('products',data,p.id);if(!p.id&&p.openingStock){move(r,quantity(p.openingStock),'Opening stock','');}result={id:r.id};break;}
 case 'stock.adjust':{const r=find(s,'products',p.productId);expected(r,p);const delta=Number(p.delta);assert(Number.isFinite(delta)&&delta!==0&&Math.abs(delta)<=100000,'Enter a non-zero stock change.');move(r,quantity(Math.abs(delta))*Math.sign(delta),text(p.reason,200,true),'adjustment');break;}
 case 'purchase.create':{const product=find(s,'products',p.productId);const qty=quantity(p.qty,0.001);const cost=amount(p.unitCost);const total=amount(p.total??Math.round(cost*qty));const paid=amount(p.paid||0);assert(paid<=total,'Paid amount exceeds purchase total.');const method=paid?p.method:'cash';assert(METHODS.includes(method),'Select a payment method.');const d=date(p.date||today);const r=row({productId:product.id,productName:product.name,qty,unitCost:cost,total,paid,method,supplier:text(p.supplier,100,true),billNumber:text(p.billNumber,100,true),date:d,note:text(p.note,500),attachment:p.attachment?validateAttachment(p.attachment):null,by:actor.name},op.id,now);s.purchases.push(r);if(paid)(s.vendorPayments??=[]).push(row({purchaseId:r.id,amount:paid,method,date:d,by:actor.name},op.id+'-vendor',now));const oldStock=product.stock;product.cost=Math.round((product.cost*oldStock+cost*qty)/(oldStock+qty));if(p.expiry)product.expiry=date(p.expiry);move(product,qty,'Purchase received',r.id);result={id:r.id};break;}
 case 'purchase.pay':{const r=find(s,'purchases',p.purchaseId);const val=amount(p.amount);assert(val>0&&val<=r.total-r.paid,'Payment exceeds the amount due to this supplier.');assert(METHODS.includes(p.method),'Select a payment method.');change(r,{paid:r.paid+val});(s.vendorPayments??=[]).push(row({purchaseId:r.id,amount:val,method:p.method,date:today,reference:text(p.reference,100),by:actor.name},op.id,now));result={id:r.id};break;}
 case 'expense.create':{const val=amount(p.amount);assert(val>0,'Enter an expense amount.');assert(METHODS.includes(p.method),'Select a payment method.');const r=row({category:text(p.category,60,true),description:text(p.description,200,true),amount:val,method:p.method,date:date(p.date||today),payee:text(p.payee,100),receipt:text(p.receipt,100),attachment:p.attachment?validateAttachment(p.attachment):null,by:actor.name,status:'posted'},op.id,now);s.expenses.push(r);result={id:r.id};break;}
 case 'appointment.save':{const c=find(s,'customers',p.customerId);const svc=find(s,'services',p.serviceId);const st=find(s,'staff',p.staffId);assert(active(st)&&active(svc),'Select active staff and service.');const d=date(p.date);assert(/^\d{2}:\d{2}$/.test(p.time),'Choose an appointment time.');const mins=Number(p.time.slice(0,2))*60+Number(p.time.slice(3));assert(mins>=0&&mins<1440&&Number(p.time.slice(3))<60,'Invalid appointment time.');const duration=integer(p.duration||svc.duration,5,720);assert(mins+duration<=1440,'Appointment ends after midnight.');const status=p.status||'booked';assert(['booked','arrived','completed','cancelled','no-show'].includes(status),'Invalid appointment status.');if(['booked','arrived'].includes(status)){assert(!s.appointments.some(a=>a.id!==p.id&&a.staffId===st.id&&a.date===d&&['booked','arrived'].includes(a.status)&&mins<a.start+a.duration&&mins+duration>a.start),'This staff member already has a booking at that time.');}const r=save('appointments',{customerId:c.id,customerName:c.name,serviceId:svc.id,serviceName:svc.name,staffId:st.id,staffName:st.name,date:d,time:p.time,start:mins,duration,status,note:text(p.note,300)},p.id);result={id:r.id};break;}
 case 'invoice.create':{if(p.customerId)find(s,'customers',p.customerId);const q=quote(s,p,actor,now);if(p.expectedTotal!==undefined)assert(p.expectedTotal===q.total,'Prices or tax changed while you were preparing this bill. Refresh and review the new total.',409);const payments=(p.payments||[]).map(x=>({method:x.method,amount:amount(x.amount),reference:text(x.reference,100)})).filter(x=>x.amount>0);assert(payments.every(x=>METHODS.includes(x.method)),'Invalid payment method.');const paid=payments.reduce((n,p)=>n+p.amount,0);assert(paid<=q.total,'Payment exceeds the bill.');assert(paid===q.total||p.customerId,'Select a customer for a bill with an unpaid balance.');const year=Number(today.slice(0,4))-(Number(today.slice(5,7))<4?1:0);const period=`${year}-${String(year+1).slice(2)}`;const seq=s.invoices.filter(i=>i.period===period).length+1;const customer=s.customers.find(x=>x.id===p.customerId);const invoice=row({...q,number:`${s.settings.invoicePrefix}/${period}/${String(seq).padStart(5,'0')}`,period,date:today,customerId:p.customerId||'',customerName:customer?.name||'Walk-in customer',customerPhone:customer?.phone||'',note:text(p.note,500),discountReason:text(p.discountReason,300),status:'posted',by:actor.name,business:copy(s.settings),appointmentId:p.appointmentId||''},op.id,now);s.invoices.push(invoice);for(let i=0;i<payments.length;i++)s.payments.push(row({...payments[i],invoiceId:invoice.id,invoiceNumber:invoice.number,customerId:invoice.customerId,date:today,by:actor.name},`${op.id}-pay-${i}`,now));for(const c of q.consumed)move(find(s,'products',c.productId),-c.qty,'Invoice '+invoice.number,invoice.id);if(p.appointmentId){const a=find(s,'appointments',p.appointmentId);assert(a.customerId===p.customerId,'Appointment customer does not match the bill.');assert(!original.invoices.some(i=>i.appointmentId===a.id&&i.status==='posted'),'This appointment is already billed.');change(a,{status:'completed',invoiceId:invoice.id});}result={id:invoice.id,number:invoice.number};break;}
 case 'payment.create':{const invoice=find(s,'invoices',p.invoiceId);assert(invoice.status==='posted','This invoice is cancelled.');const val=amount(p.amount);assert(val>0&&val<=balance(s,invoice.id),'Payment exceeds the outstanding balance.');assert(METHODS.includes(p.method),'Select a payment method.');s.payments.push(row({invoiceId:invoice.id,invoiceNumber:invoice.number,customerId:invoice.customerId,amount:val,method:p.method,reference:text(p.reference,100),date:today,by:actor.name},op.id,now));result={id:invoice.id};break;}
 case 'invoice.void':{owner(actor);const invoice=find(s,'invoices',p.invoiceId);assert(invoice.status==='posted','This bill is already cancelled.');const reason=text(p.reason,300,true);change(invoice,{status:'void',voidReason:reason,voidAt:now,voidBy:actor.name});const received=s.payments.filter(x=>x.invoiceId===invoice.id).reduce((v,x)=>v+x.amount,0);if(received){assert(METHODS.includes(p.method),'Select how the refund was paid.');assert(p.refundConfirmed===true,'Confirm the money was actually refunded before cancelling this paid bill.');s.payments.push(row({invoiceId:invoice.id,invoiceNumber:invoice.number,customerId:invoice.customerId,amount:-received,method:p.method,reference:reason,date:today,by:actor.name},op.id+'-refund',now));}if(p.returnStock===true)for(const c of invoice.consumed)move(find(s,'products',c.productId),c.qty,'Cancelled invoice stock returned',invoice.id);result={id:invoice.id};break;}

function dashboardView(){const s=A.data,today=day(),m=metrics(s,today,today),monthly=metrics(s,monthStart(),today),apps=s.appointments.filter(a=>a.date===today&&a.status!=='cancelled').sort((a,b)=>a.start-b.start);const low=s.products.filter(p=>active(p)&&p.stock<=p.reorder);const recent=[...s.invoices].reverse().slice(0,5);let dates=[];for(let i=13;i>=0;i--)dates.push(day(new Date(Date.now()-i*86400000)));const range=metrics(s,dates[0],today);const values=dates.map(d=>range.daily.find(x=>x[0]===d)?.[1]||0);const max=Math.max(...values,1);return title(`A good day starts here.`,`Here's what's happening at your salon today, ${niceDate(today)}.`,`${btn(icon('calendar')+'Appointments','nav','',`data-target="appointments"`)}${btn(icon('plus')+'New bill','nav','primary',`data-target="billing"`)}`)+`<div class="stats">${stat("Today's sales",money(m.sales),m.invoices.length+' completed bills','rupee',true)}${stat('Money received',money(m.collections),'Cash, UPI, card & bank','wallet')}${stat("Today's bookings",apps.length,apps.filter(x=>x.status==='booked').length+' upcoming appointments','calendar')}${stat('Customer dues',money(m.outstanding),'Outstanding across all dates','receipt')}</div><div class="grid-2">${card('Sales at a glance',`<div class="card-body"><div class="actions" style="justify-content:space-between"><div><div class="stat-value" style="margin:0">${money(monthly.net)}</div><small>This month · sales before tax</small></div>${badge('Last 14 days','gray')}</div><div class="chart">${dates.map((d,i)=>`<div class="bar-col"><div class="bar" style="height:${Math.max(values[i]/max*100,1)}%"><span class="chart-tip">${niceDate(d)} · ${money(values[i])}</span></div><span class="bar-label">${i%2===0||i===13?d.slice(8):''}</span></div>`).join('')}</div></div>`,A.user.role==='owner'?btn('View reports '+icon('arrow'),'nav','small',`data-target="reports"`):'')}${card("Today's appointments",`<div class="card-body">${apps.length?apps.slice(0,4).map(a=>`<div class="list-row">< function invoiceHtml(i){const s=i.business;const pays=A.data.payments.filter(p=>p.invoiceId===i.id);return `<article class="invoice"><header class="invoice-head"><div><p class="eyebrow">${DEMO?'DEMO · NOT A REAL BILL':'RECEIPT / INVOICE'}</p><h1>${esc(s.salonName)}</h1><p>${esc(s.address).replaceAll('\n','<br>')}</p><p>${esc(s.phone)}${s.gstin?' · GSTIN: '+esc(s.gstin):''}</p></div><div><strong>${esc(i.number)}</strong><p>${niceDate(i.date)}</p>${i.status==='void'?'<strong>CANCELLED</strong>':''}</div></header><div class="invoice-client"><strong>${esc(i.customerName)}</strong><p>${esc(i.customerPhone)}</p><p>Served by: ${esc(i.by)}</p></div>${table(['Service / product','Qty','Price','Discount','Net','Tax','Total'],i.lines.map(l=>`<tr><td>${esc(l.name)}<small>${l.staffName?' · '+esc(l.staffName):''}</small></td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.discount)}</td><td>${money(l.net)}</td><td>${money(l.tax)} (${l.taxBps/100}%)</td><td>${money(l.total)}</td></tr>`))}<div class="invoice-totals"><p>Before tax <strong>${money(i.net)}</strong></p><p>${esc(s.taxLabel)} <strong>${money(i.tax)}</strong></p><p class="grand">Total <strong>${money(i.total)}</strong></p><p>Received (less refunds) <strong>${money(pays.reduce((n,p)=>n+p.amount,0))}</strong></p><p>Balance due <strong>${money(balance(A.data,i.id))}</strong></p></div><h3>Payment history</h3>${table(['Date','Method','Amount','Reference'],pays.map(p=>`<tr><td>${niceDate(p.date)}</td><td>${esc(p.method.toUpperCase())}</td><td>${money(p.amount)}</td><td>${esc(p.reference)}</td></tr>`))}<p>${esc(i.note)}</p>${i.status==='void'?`<p>Cancellation reason: ${esc(i.voidReason)}</p>`:''}<footer><strong>${esc(s.receiptNote)}</strong><p>Please follow the care advice given by your service professional.</p></footer></article>`;}
function invoiceModal(id){const i=find(A.data,'invoices',id);modal('Invoice '+i.number,`<div class="actions" style="margin-bottom:18px">${btn(icon('print')+'Print / save PDF','print-invoice','',`data-id="${id}"`)}${balance(A.data,id)>0?btn('Receive payment','receive-payment','primary',`data-id="${id}"`):''}${A.user.role==='owner'&&i.status==='posted'?btn('Cancel bill','void-invoice','danger',`data-id="${id}"`):''}</div>`+invoiceHtml(i),null,'',true);}
function voidForm(id){const i=find(A.data,'invoices',id),paid=A.data.payments.filter(x=>x.invoiceId===id).reduce((n,p)=>n+p.amount,0);modal('Cancel this bill',`<div class="notice warn">${esc(i.number)} · ${money(i.total)}<br>This keeps the bill in history and removes it from active sales. ${paid?'Record the actual refund of '+money(paid)+' below.':''}</div>`+fields(area('reason','Reason for cancellation'),paid?select('method','Refund paid through',methods,'cash'):'',paid?check('refundConfirmed','I have actually returned the money to the customer'): '',check('returnStock','All consumed items were returned unused and can be added back to stock')),async(v,f)=>{await saveRecord('invoice.void',{invoiceId:id,...v,refundConfirmed:f.elements.refundConfirmed?.checked===true,returnStock:f.elements.returnStock.checked},'Bill cancelled');invoiceModal(id);},'Cancel bill');}
function customerHistory(id){const c=find(A.data,'customers',id),invoices=A.data.invoices.filter(i=>i.customerId===id).reverse();modal(c.name+' · client history',`<div class="mini-grid"><div class="mini"><small>Phone</small><strong>${esc(c.phone||'Not saved')}</strong></div><div class="mini"><small>Customer dues</small><strong>${money(invoices.reduce((n,i)=>n+balance(A.data,i.id),0))}</strong></div></div><div class="notice" style="margin:18px 0"><strong>Care & follow-up notes</strong><p>${esc(c.notes||'No notes yet.').replaceAll('\n','<br>')}</p>Promotional contact consent: ${c.marketingConsent?'Yes':'No'}${c.membershipUntil?'<br>Membership until '+niceDate(c.membershipUntil):''}</div>${btn('Edit details / notes','edit-customer','',`data-id="${id}"`)}<h3 style="margin-top:20px">Visit history</h3>${table(['Invoice','Customer','Date','Status','Total',''],invoiceRows(invoices))}`,null,'',true);}
function stockHistory(id){const p=find(A.data,'products',id),moves=A.data.stockMoves.filter(x=>x.productId===id).reverse();modal(p.name+' · stock history',table(['Date','Change','Balance','Reason','Recorded by'],moves.map(x=>`<tr><td>${niceDate(x.date)}</td><td>${x.delta>0?'+':''}${x.delta}</td><td>${x.balance}</td><td>${esc(x.reason)}</td><td>${esc(x.by)}</td></tr>`)),null,'',true);}
function download(name,content,type='text/plain'){const blob=content instanceof Blob?content:new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function printContent(content){$('#print-area').innerHTML=content;window.print();}
function clearBill(){A.cart=[];A.draft={customerId:'',discount:'0',discountReason:'',note:'',cash:'',upi:'',card:'',bank:''};}
function rerenderSearch(selector){const el=$(selector),pos=el?.selectionStart;renderPage();const next=$(selector);next?.focus();if(pos!=null&&next?.setSelectionRange)next.setSelectionRange(pos,pos);}
const actions={
 'choose-role':el=>{A.role=el.dataset.role;renderLogin();},nav:el=>go(el.dataset.target),refresh:()=>sync(),menu:()=>$('.sidebar').classList.toggle('open'),
 logout:async()=>{if(A.cart.length&&!confirm('You have an unsaved bill. Sign out and discard it?'))return;if(!DEMO)await api('logout',{});A.user=null;A.data=null;A.csrf='';clearBill();closeModal();renderLogin();},
 'reset-demo':()=>{if(confirm('Delete all changes in this demo and restore the sample records?')){localStorage.removeItem('skynn-soul-demo-v1');A.data=demoInit();clearBill();renderPage();toast('Demo reset');}},
 'close-modal':closeModal,'new-customer':()=>customerForm(),'edit-customer':e=>customerForm(e.dataset.id),'customer-history':e=>customerHistory(e.dataset.id),
 'new-service':()=>serviceForm(),'edit-service':e=>serviceForm(e.dataset.id),'new-product':()=>productForm(),'edit-product':e=>productForm(e.dataset.id),'receive-stock':e=>purchaseForm(e.dataset.id),'adjust-stock':e=>adjustForm(e.dataset.id),'stock-history':e=>stockHistory(e.dataset.id),
 'new-staff':()=>staffForm(),'edit-staff':e=>staffForm(e.dataset.id),'new-appointment':()=>appointmentForm(),'edit-appointment':e=>appointmentForm(e.dataset.id),
 'bill-appointment':e=>{if(A.cart.length&&!confirm('Replace the current unsaved bill with this appointment?'))return;const a=find(A.data,'appointments',e.dataset.id);clearBill();A.draft.customerId=a.customerId;A.draft.appointmentId=a.id;A.cart=[{kind:'service',id:a.serviceId,qty:1,staffId:a.staffId}];A.page='billing';renderShell();},
 'catalog-type':e=>{A.catalogType=e.dataset.type;A.category='All';renderPage();},category:e=>{A.category=e.dataset.value;renderPage();},
 'add-cart':e=>{const {id,kind}=e.dataset;const existing=A.cart.find(x=>x.id===id&&x.kind===kind);if(existing)existing.qty++;else A.cart.push({id,kind,qty:1,staffId:''});$('#bill-summary').innerHTML=billSummary();},
 'remove-cart':e=>{A.cart.splice(Number(e.dataset.index),1);$('#bill-summary').innerHTML=billSummary();},'qty-up':e=>{A.cart[Number(e.dataset.index)].qty++;$('#bill-summary').innerHTML=billSummary();},'qty-down':e=>{const i=Number(e.dataset.index);if(A.cart[i].qty>1)A.cart[i].qty--;else A.cart.splice(i,1);$('#bill-summary').innerHTML=billSummary();},
 'fill-payment':e=>{const {q,error}=billQuote();assert(q,error);for(const m of METHODS)A.draft[m]=m===e.dataset.method?rupees(q.total):'';$('#bill-summary').innerHTML=billSummary();},
 'clear-bill':()=>{if(confirm('Clear this unsaved bill?')){clearBill();renderPage();}},
 'save-bill':async()=>{const result=await mutate('invoice.create',billPayload());clearBill();renderPage();toast('Bill saved'+(DEMO?' in this demo':' to GitHub'));invoiceModal(result.id);},
 'view-invoice':e=>invoiceModal(e.dataset.id),'print-invoice':e=>printContent(invoiceHtml(find(A.data,'invoices',e.dataset.id))),'receive-payment':e=>paymentForm(e.dataset.id),'void-invoice':e=>voidForm(e.dataset.id),
 'finance-tab':e=>{A.financeTab=e.dataset.tab;renderPage();},'new-expense':expenseForm,'pay-supplier':e=>supplierPayment(e.dataset.id),
 attachment:e=>{const a=find(A.data,e.dataset.collection,e.dataset.id).attachment;assert(a,'No receipt saved.');const raw=atob(a.data),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));download(a.name,new Blob([bytes],{type:a.type}));toast('Receipt downloaded');},
 'save-attendance':async e=>{const id=e.dataset.id,a=A.data.attendance.find(x=>x.staffId===id&&x.date===A.staffDate);await mutate('attendance.save',{staffId:id,date:A.staffDate,version:a?.version,status:$('#att-'+id).value,note:$('#att-note-'+id).value});renderPage();toast('Attendance saved');},
 'download-template':()=>download(A.importKind+'-template.csv',TEMPLATE[A.importKind],'text/csv;charset=utf-8'),
 'confirm-import':async()=>{assert(A.importPrepared?.length,'Choose a valid CSV first.');const r=await mutate('import.rows',{kind:A.importKind,rows:A.importPrepared});A.importPrepared=null;A.importRows=[];renderPage();toast(r.count+' records imported');},
 'export-report':()=>{const r=reportData();download('skynn-soul-'+A.report+'-'+A.from+'-'+A.to+'.csv',csvExport(r.h,r.r),'text/csv;charset=utf-8');},
 'print-report':()=>{const r=reportData();printContent(`<article class="invoice"><h1>${esc(A.data.settings.salonName)}</h1><h2>${esc(A.report)} report</h2><p>${niceDate(A.from)} to ${niceDate(A.to)} · ${DEMO?'Sample records':'Saved records'}</p>${table(r.h.map(esc),r.r.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`))}</article>`);},
 backup:async()=>{assert(A.user.role==='owner','Owner access required.');const backup=DEMO?{format:'skynn-soul-backup-v1',exportedAt:new Date().toISOString(),state:A.data}:await api('backup');download('skynn-soul-backup-'+day()+'.json',JSON.stringify(backup,null,2),'application/json');},
 'reopen-day':e=>modal('Reopen a closed day',area('reason','Why does this day need to be reopened?'),async v=>saveRecord('closure.reopen',{id:e.dataset.id,reason:v.reason},'Day reopened')),
 'prev-page':()=>{A.tablePage=Math.max(1,A.tablePage-1);renderPage();},'next-page':()=>{A.tablePage++;renderPage();}
};
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const act=actions[el.dataset.action];if(!act)return;try{el.disabled=true;await act(el);}catch(err){toast(err.message,true);}finally{el.disabled=false;}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,values=Object.fromEntries(new FormData(f).entries()),submit=f.querySelector('[type="submit"]');if(submit)submit.disabled=true;try{if(f.id==='login-form'){if(DEMO){A.user={role:A.role,name:A.role==='owner'?'Salon owner':'Salon manager'};A.data=demoInit();}else{const r=await api('login',{role:A.role,password:values.password});A.user=r.user;A.csrf=r.csrf;const d=await api('state');A.data=d.state;A.savedAt=d.savedAt;}A.page='dashboard';renderShell();}else if(f.id==='modal-form'&&modalSave){$('#modal-error').innerHTML='';await modalSave(values,f);}else if(f.id==='settings-form'){await mutate('settings.save',{...values,revision:A.data.revision,defaultTaxBps:Math.round(Number(values.defaultTaxPercent)*100),managerDiscountBps:Math.round(Number(values.managerDiscountPercent)*100)});renderPage();toast('Settings saved');}else if(f.id==='close-form'){await mutate('closure.create',{date:day(),opening:paise(values.opening),added:paise(values.added||'0'),withdrawn:paise(values.withdrawn||'0'),actual:paise(values.actual),note:values.note});renderPage();toast('Day closing saved');}}catch(err){const target=f.id==='login-form'?$('#login-error'):f.id==='modal-form'?$('#modal-error'):null;if(target)target.innerHTML=`<div class="form-error" role="alert">${esc(err.message)}</div>`;else toast(err.message,true);}finally{if(submit)submit.disabled=false;}});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='list-search'){A.search=el.value;A.tablePage=1;rerenderSearch('#list-search');}if(el.id==='catalog-search'){A.catalogSearch=el.value;rerenderSearch('#catalog-search');}if(el.dataset.draft){A.draft[el.dataset.draft]=el.value;const {q}=billQuote();const paid=METHODS.reduce((n,m)=>n+(Number(A.draft[m])||0)*100,0);if($('#bill-due'))$('#bill-due').textContent=q?'Balance due: '+money(q.total-Math.round(paid)):'Check bill values before saving.';}if(el.closest('#close-form')){const v=Object.fromEntries(new FormData($('#close-form')));const n=closingNumbers(v);$('#closing-preview').textContent='Expected cash: '+money(n.expected)+(v.actual?' · Difference: '+money(Number(v.actual)*100-n.expected):'');}});
document.addEventListener('change',async e=>{const el=e.target;try{if(el.id==='bill-customer')A.draft.customerId=el.value;if(el.dataset.cartIndex!==undefined)A.cart[Number(el.dataset.cartIndex)].staffId=el.value;if(el.dataset.draft&&['discount','discountReason'].includes(el.dataset.draft))$('#bill-summary').innerHTML=billSummary();if(el.id==='appointment-date'){A.date=el.value;renderPage();}if(el.id==='staff-date'){A.staffDate=el.value;renderPage();}if(el.id==='report-type'){A.report=el.value;renderPage();}if(el.id==='report-from'||el.id==='report-to'){const key=el.id==='report-from'?'from':'to',old=A[key];A[key]=el.value;if(!A.from||!A.to||A.from>A.to){A[key]=old;el.value=old;throw new Error('Choose a valid date range.');}renderPage();}if(el.id==='import-kind'){A.importKind=el.value;A.importPrepared=null;A.importRows=[];renderPage();}if(el.id==='import-file'){const f=el.files[0];if(!f)return;assert(f.size<2000000,'CSV must be under 2 MB.');A.importPrepared=null;A.importRows=[];const rows=csvRows(await f.text()),prepared=prepareImport(A.importKind,rows);applyOperation(A.data,{id:uid(),type:'import.rows',payload:{kind:A.importKind,rows:prepared}},A.user);A.importRows=rows;A.importPrepared=prepared;renderPage();toast('File checked. Review it before importing.');}if(el.name==='serviceId'&&$('#modal-form')?.elements.duration){const svc=A.data.services.find(x=>x.id===el.value);if(svc)$('#modal-form').elements.duration.value=svc.duration;}if(el.name==='productId'&&$('#modal-form')?.elements.unitCost){const p=A.data.products.find(x=>x.id===el.value);if(p){$('#modal-form').elements.unitCost.value=rupees(p.cost);$('#modal-form').elements.supplier.value=p.supplier||'';}}}catch(err){toast(err.message,true);}});
document.addEventListener('keydown',e=>{const root=$('#modal-root');if(!root.children.length)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const focusables=[...root.querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
window.addEventListener('beforeunload',e=>{if(A.cart.length||A.busy){e.preventDefault();e.returnValue='';}});
window.addEventListener('storage',e=>{if(DEMO&&e.key==='skynn-soul-demo-v1'&&A.user)sync(true);});
(async()=>{if(DEMO){renderLogin();return;}try{const session=await api('session');A.user=session.user;A.csrf=session.csrf;const r=await api('state');A.data=r.state;A.savedAt=r.savedAt;renderShell();}catch(err){A.user=null;renderLogin(err.message==='Please sign in again.'?'':err.message);}})();
</script></body></html>
