name: Check salon app
on:
  push:
    paths: ['salon-app/**', '.github/workflows/check.yml']
  pull_request:
    paths: ['salon-app/**', '.github/workflows/check.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: salon-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run build
      - run: npm run check
